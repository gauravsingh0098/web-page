  <style>
    :root {
      color-scheme: light;
      --bg: #F8F0E3;
      --surface: #FFFBF4;
      --band: #EEDCC2;
      --beige: #F2E4CE;
      --ink: #33241A;
      --muted: #65503F;
      --head: #5B3A21;
      --forest: #7A4B2A;
      --btn: #7B4A2A;
      --btn-fg: #FFFFFF;
      --btn-hover: #5E3519;
      --gold: #C28B3C;
      --gold-ink: #7A4F18;
      --line: rgba(194, 139, 60, 0.42);
      --hair: rgba(91, 58, 33, 0.16);
      --shadow: 0 14px 40px rgba(91, 58, 33, 0.16);
      --shadow-sm: 0 4px 14px rgba(91, 58, 33, 0.11);
      --foot: #6B4429;
      --foot-fg: #F8EBD6;
      --head-bg: rgba(248, 240, 227, 0.86);
      --serif: "Cormorant Garamond", Georgia, serif;
      --hi: "Tiro Devanagari Hindi", serif;
      --sans: "Hind", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 84px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.65;
      overflow-x: hidden;
    }
    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4 { font-family: var(--serif); color: var(--head); margin: 0; font-weight: 600; line-height: 1.2; }
    .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; }

    /* Header */
    .site-head {
      position: sticky; top: 0; z-index: 50;
      background: var(--head-bg); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .head-in {
      display: flex; align-items: center; justify-content: space-between;
      height: 72px; max-width: 1180px; margin: 0 auto; padding-inline: 20px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-name { font-size: 1.5rem; font-weight: 700; color: var(--head); }
    .brand-name small { display: block; font-family: var(--hi); font-size: 0.8rem; color: var(--gold-ink); }
    .nav { display: flex; gap: 16px; }
    .nav a { font-weight: 500; padding: 6px 12px; border-radius: 999px; transition: background .2s; }
    .nav a:hover { background: var(--band); }

    /* Hero */
    .hero { padding: 80px 0; background: radial-gradient(circle at 85% 20%, var(--band), transparent 70%); }
    .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; }
    .pill {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--gold); background: var(--surface);
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; color: var(--gold-ink);
    }
    .hero h1 { font-family: var(--hi); font-size: clamp(2rem, 4.5vw, 3.5rem); margin-top: 18px; }
    .hero p.lead { margin-top: 16px; color: var(--muted); font-size: 1.1rem; }
